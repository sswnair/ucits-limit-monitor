[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ucits-limit-monitor"
version = "0.1.0"
description = "UCITS diversification limits and VaR global exposure checks on public ETF data"
readme = "README.md"
authors = [{ name = "Sanjay Nair" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
ucits-monitor = "ucits_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
